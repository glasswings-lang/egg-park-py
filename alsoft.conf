# OpenAL Soft settings for Egg Park.
#
# main.py points ALSOFT_CONF here. OpenAL Soft reads it after every other
# configuration file, including %AppData%\alsoft.ini, so these keys win over a
# machine-wide setting made for some other program. Everything not set here,
# such as the output driver, still comes from that file. A player's own
# ALSOFT_CONF wins over this one: main.py only sets it when it is unset.

[general]
stereo-encoding = hrtf
hrtf = true

# SADIE II subject D1 (Neumann KU100 dummy head), in hrtf/ beside main.py. Not
# the InvertedY file from the same collection: that one has above and below
# swapped. The trailing comma keeps OpenAL Soft's own search after hrtf/, its
# built-in set included, so a missing file still leaves HRTF on.
default-hrtf = SADIE_D1-48000
hrtf-paths = ${EGG_PARK_HRTF},
